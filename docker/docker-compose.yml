version: '3.8'

# EDEN Docker Compose Configuration
# Full stack deployment with MongoDB, Redis, and EDEN application

services:
  # ============================================
  # MongoDB
  # ============================================
  mongodb:
    image: mongo:7
    container_name: eden-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: eden
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: mongod --auth --bind_ip_all

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7
    container_name: eden-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ============================================
  # EDEN Backend
  # ============================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_ENV: development
    container_name: eden-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ../logs:/app/logs
      - ../uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://root:example@mongodb:27017/eden?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      BASE_URL: http://localhost:4000
      ENABLE_METRICS: "true"
      ENABLE_FILE_LOGGING: "true"
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:4200
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@eden.dev
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # EDEN Frontend (Nginx)
  # ============================================
  frontend:
    image: nginx:alpine
    container_name: eden-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    volumes:
      - ../dist/browser:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eden-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Grafana (Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: eden-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Mongo Express (MongoDB Admin)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: eden-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - eden-network

  # ============================================
  # Redis Commander (Redis Admin)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: eden-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - eden-network

# ============================================
# Volumes
# ============================================
volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  prometheus_data:
  grafana_data:

# ============================================
# Networks
# ============================================
networks:
  eden-network:
    driver: bridge
