name: EDEN Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  MONGO_VERSION: '7'
  REDIS_VERSION: '7'

jobs:
  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:${{ env.MONGO_VERSION }}
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run unit tests
        env:
          MONGO_URI: mongodb://root:example@localhost:27017/eden_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: |
          npm test -- --forceExit --detectOpenHandles --testPathPattern="tests/.*\\.test\\.ts$"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/
            coverage/

  # ============================================
  # Integration Tests
  # ============================================
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:${{ env.MONGO_VERSION }}
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run integration tests
        env:
          MONGO_URI: mongodb://root:example@localhost:27017/eden_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          BASE_URL: http://localhost:4000
        run: |
          npm test -- --forceExit --detectOpenHandles --testPathPattern="tests/integration/.*\\.test\\.ts$"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage/

  # ============================================
  # E2E Tests
  # ============================================
  e2e-tests:
    name: E2E Tests
    needs: integration-tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:${{ env.MONGO_VERSION }}
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build application
        run: |
          npm run build -- --configuration production

      - name: Start server in background
        env:
          MONGO_URI: mongodb://root:example@localhost:27017/eden_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key
          NODE_ENV: test
          PORT: 4000
        run: |
          npx ts-node src/server/index.ts &
          sleep 10

      - name: Run E2E tests
        env:
          API_URL: http://localhost:4000
          MONGO_URI: mongodb://root:example@localhost:27017/eden_test?authSource=admin
        run: |
          npm run e2e -- --baseUrl=http://localhost:4000

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e-results/

  # ============================================
  # Lint Check
  # ============================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run lint
        run: |
          npm run lint

  # ============================================
  # Type Check
  # ============================================
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run type check
        run: |
          npx tsc --noEmit --skipLibCheck

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Test Summary
    needs: [unit-tests, integration-tests, e2e-tests, lint, type-check]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate test report
        run: |
          mkdir -p test-reports
          echo "# Test Summary" > test-reports/summary.md
          echo "" >> test-reports/summary.md
          echo "## Unit Tests" >> test-reports/summary.md
          echo "Status: ${{ needs.unit-tests.result }}" >> test-reports/summary.md
          echo "" >> test-reports/summary.md
          echo "## Integration Tests" >> test-reports/summary.md
          echo "Status: ${{ needs.integration-tests.result }}" >> test-reports/summary.md
          echo "" >> test-reports/summary.md
          echo "## E2E Tests" >> test-reports/summary.md
          echo "Status: ${{ needs.e2e-tests.result }}" >> test-reports/summary.md
          echo "" >> test-reports/summary.md
          echo "## Lint" >> test-reports/summary.md
          echo "Status: ${{ needs.lint.result }}" >> test-reports/summary.md
          echo "" >> test-reports/summary.md
          echo "## Type Check" >> test-reports/summary.md
          echo "Status: ${{ needs.type-check.result }}" >> test-reports/summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-reports/

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-reports/summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Results\n\n${summary}`
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
