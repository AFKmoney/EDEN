name: Publish v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.yml'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create or update v1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: EDEN 1.0.0 — Kleene kernel
          target_commitish: main
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
