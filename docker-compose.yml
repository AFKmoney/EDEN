version: '3.8'

services:
  # ============================================
  # EDEN Backend + Frontend
  # ============================================
  eden:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eden-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LOCAL_MODEL=${LOCAL_MODEL:-qwen2.5-coder}
      - LOCAL_API_URL=http://ollama:11434/api/generate
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    networks:
      - eden-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Ollama for Local AI Models
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - eden-network
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================
  # Optional: Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: eden-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - eden
    networks:
      - eden-network

  # ============================================
  # Optional: Redis for Session/Cache
  # ============================================
  redis:
    image: redis:alpine
    container_name: eden-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eden-network

networks:
  eden-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
  redis-data:
    driver: local
