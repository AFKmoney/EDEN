<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="scopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#091122"/>
    </linearGradient>
    <filter id="waveGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="waveGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="waveGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#scopeBg)"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1200" height="46" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="28" fill="#38bdf8" class="mono" font-size="14" font-weight="700">&lt; LOGIC ANALYZER // MULTI-CHANNEL OSCILLOSCOPE &amp; FORMAL VERIFICATION &gt;</text>
  <rect x="990" y="10" width="180" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981"/>
  <text x="1080" y="26" fill="#34d399" class="mono" font-size="11" text-anchor="middle">&#x25CF; LIVE SAMPLING (100 Hz)</text>

  <!-- LEFT HALF: MULTI-CHANNEL OSCILLOSCOPE -->
  <g transform="translate(30, 70)">
    <rect width="660" height="565" rx="14" fill="#070c18" stroke="#1e3a5f" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    
    <!-- Oscilloscope Header -->
    <rect width="660" height="38" fill="#0b172e" rx="14 14 0 0"/>
    <text x="20" y="24" fill="#38bdf8" class="mono" font-size="12" font-weight="700">WAVEFORM TRACES // 4 CHANNELS</text>
    <text x="540" y="24" fill="#64748b" class="mono" font-size="11">TIMESCALE: 50ms/DIV</text>

    <!-- Scope Screen Grid Lines -->
    <g stroke="#16233b" stroke-width="1" stroke-dasharray="3 3">
      <!-- Horizontal division lines -->
      <line x1="80" y1="90" x2="630" y2="90"/>
      <line x1="80" y1="140" x2="630" y2="140"/>
      <line x1="80" y1="190" x2="630" y2="190"/>
      
      <line x1="80" y1="230" x2="630" y2="230"/>
      <line x1="80" y1="280" x2="630" y2="280"/>
      <line x1="80" y1="330" x2="630" y2="330"/>

      <line x1="80" y1="370" x2="630" y2="370"/>
      <line x1="80" y1="420" x2="630" y2="420"/>
      <line x1="80" y1="470" x2="630" y2="470"/>

      <!-- Vertical division lines -->
      <line x1="150" y1="60" x2="150" y2="520"/>
      <line x1="220" y1="60" x2="220" y2="520"/>
      <line x1="290" y1="60" x2="290" y2="520"/>
      <line x1="360" y1="60" x2="360" y2="520"/>
      <line x1="430" y1="60" x2="430" y2="520"/>
      <line x1="500" y1="60" x2="500" y2="520"/>
      <line x1="570" y1="60" x2="570" y2="520"/>
    </g>

    <!-- Channel Labels (Y-Axis) -->
    <!-- Channel 1: INPUT_A (Ternary Steps) -->
    <g transform="translate(15, 90)">
      <rect x="0" y="20" width="55" height="45" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <text x="27" y="40" fill="#38bdf8" class="mono" font-size="10" font-weight="700" text-anchor="middle">CH1</text>
      <text x="27" y="55" fill="#94a3b8" class="mono" font-size="8" text-anchor="middle">IN_A</text>
      
      <!-- Levels -->
      <text x="68" y="15" fill="#64748b" class="mono" font-size="9">+1</text>
      <text x="70" y="52" fill="#64748b" class="mono" font-size="9">0</text>
      <text x="68" y="88" fill="#64748b" class="mono" font-size="9">-1</text>
    </g>

    <!-- CH1 Waveform (Cyan) -->
    <path d="M 80 105 L 150 105 L 150 140 L 250 140 L 250 175 L 340 175 L 340 105 L 450 105 L 450 140 L 530 140 L 530 175 L 630 175"
          fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#waveGlowCyan)"/>

    <!-- Channel 2: INPUT_B (Emerald) -->
    <g transform="translate(15, 230)">
      <rect x="0" y="20" width="55" height="45" rx="6" fill="#059669" fill-opacity="0.2" stroke="#059669"/>
      <text x="27" y="40" fill="#34d399" class="mono" font-size="10" font-weight="700" text-anchor="middle">CH2</text>
      <text x="27" y="55" fill="#94a3b8" class="mono" font-size="8" text-anchor="middle">IN_B</text>

      <text x="68" y="15" fill="#64748b" class="mono" font-size="9">+1</text>
      <text x="70" y="52" fill="#64748b" class="mono" font-size="9">0</text>
      <text x="68" y="88" fill="#64748b" class="mono" font-size="9">-1</text>
    </g>

    <!-- CH2 Waveform (Emerald) -->
    <path d="M 80 315 L 180 315 L 180 280 L 290 280 L 290 245 L 380 245 L 380 315 L 490 315 L 490 280 L 630 280"
          fill="none" stroke="#34d399" stroke-width="2.5" filter="url(#waveGlowGreen)"/>

    <!-- Channel 3: SUM_OUT (Purple) -->
    <g transform="translate(15, 370)">
      <rect x="0" y="20" width="55" height="45" rx="6" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed"/>
      <text x="27" y="40" fill="#c084fc" class="mono" font-size="10" font-weight="700" text-anchor="middle">CH3</text>
      <text x="27" y="55" fill="#94a3b8" class="mono" font-size="8" text-anchor="middle">SUM</text>

      <text x="68" y="15" fill="#64748b" class="mono" font-size="9">+1</text>
      <text x="70" y="52" fill="#64748b" class="mono" font-size="9">0</text>
      <text x="68" y="88" fill="#64748b" class="mono" font-size="9">-1</text>
    </g>

    <!-- CH3 Waveform (Purple) -->
    <path d="M 80 420 L 150 420 L 150 385 L 250 385 L 250 455 L 340 455 L 340 420 L 450 420 L 450 385 L 630 385"
          fill="none" stroke="#c084fc" stroke-width="2.5" filter="url(#waveGlowPurple)"/>

    <!-- Control Buttons at bottom of Scope -->
    <g transform="translate(80, 520)">
      <rect x="0" y="0" width="85" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="42" y="18" fill="#e2e8f0" class="mono" font-size="10" text-anchor="middle">&#x23F8; FREEZE</text>

      <rect x="95" y="0" width="85" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="137" y="18" fill="#e2e8f0" class="mono" font-size="10" text-anchor="middle">&#x23EA; REWIND</text>

      <rect x="190" y="0" width="110" height="30" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
      <text x="245" y="18" fill="#38bdf8" class="mono" font-size="10" text-anchor="middle">&#x1F4BE; EXPORT CSV</text>
    </g>
  </g>

  <!-- RIGHT HALF: TRUTH TABLE & FORMAL VERIFICATION -->
  <g transform="translate(715, 70)">
    <rect width="455" height="565" rx="14" fill="#0c1427" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    
    <!-- Table Header -->
    <rect width="455" height="38" fill="#141f36" rx="14 14 0 0"/>
    <text x="20" y="24" fill="#34d399" class="mono" font-size="12" font-weight="700">EXHAUSTIVE TRUTH TABLE (KLEENE 3^N)</text>

    <!-- Verification Badge -->
    <rect x="20" y="55" width="415" height="40" rx="8" fill="#064e3b" stroke="#059669"/>
    <circle cx="40" cy="75" r="7" fill="#10b981"/>
    <text x="60" y="80" fill="#a7f3d0" class="sans" font-size="12" font-weight="700">&#x2714; FORMAL PROOF: ALL 9 STATES VERIFIED CONGRUENT</text>

    <!-- Truth Table Headers -->
    <g transform="translate(20, 110)">
      <rect width="415" height="30" rx="6" fill="#1e293b"/>
      <text x="40" y="20" fill="#94a3b8" class="mono" font-size="11" font-weight="700">IN_A</text>
      <text x="120" y="20" fill="#94a3b8" class="mono" font-size="11" font-weight="700">IN_B</text>
      <text x="210" y="20" fill="#38bdf8" class="mono" font-size="11" font-weight="700">SUM</text>
      <text x="310" y="20" fill="#34d399" class="mono" font-size="11" font-weight="700">CARRY</text>
      <text x="385" y="20" fill="#cbd5e1" class="mono" font-size="11" font-weight="700">ST</text>
    </g>

    <!-- Table Rows -->
    <g transform="translate(20, 145)" class="mono" font-size="12">
      <!-- Row 1: (-1, -1) -> (+1, -1) -->
      <rect x="0" y="0" width="415" height="28" fill="#0f172a"/>
      <text x="40" y="19" fill="#ef4444">-1</text>
      <text x="120" y="19" fill="#ef4444">-1</text>
      <text x="210" y="19" fill="#38bdf8">+1</text>
      <text x="310" y="19" fill="#ef4444">-1</text>
      <text x="385" y="19" fill="#10b981">&#x2714;</text>

      <!-- Row 2: (-1, 0) -> (-1, 0) -->
      <rect x="0" y="32" width="415" height="28" fill="#141e33"/>
      <text x="40" y="51" fill="#ef4444">-1</text>
      <text x="120" y="51" fill="#94a3b8"> 0</text>
      <text x="210" y="51" fill="#ef4444">-1</text>
      <text x="310" y="51" fill="#94a3b8"> 0</text>
      <text x="385" y="51" fill="#10b981">&#x2714;</text>

      <!-- Row 3: (-1, +1) -> (0, 0) -->
      <rect x="0" y="64" width="415" height="28" fill="#0f172a"/>
      <text x="40" y="83" fill="#ef4444">-1</text>
      <text x="120" y="83" fill="#34d399">+1</text>
      <text x="210" y="83" fill="#94a3b8"> 0</text>
      <text x="310" y="83" fill="#94a3b8"> 0</text>
      <text x="385" y="83" fill="#10b981">&#x2714;</text>

      <!-- Row 4: (0, -1) -> (-1, 0) -->
      <rect x="0" y="96" width="415" height="28" fill="#141e33"/>
      <text x="40" y="115" fill="#94a3b8"> 0</text>
      <text x="120" y="115" fill="#ef4444">-1</text>
      <text x="210" y="115" fill="#ef4444">-1</text>
      <text x="310" y="115" fill="#94a3b8"> 0</text>
      <text x="385" y="115" fill="#10b981">&#x2714;</text>

      <!-- Row 5: (0, 0) -> (0, 0) -->
      <rect x="0" y="128" width="415" height="28" fill="#0f172a"/>
      <text x="40" y="147" fill="#94a3b8"> 0</text>
      <text x="120" y="147" fill="#94a3b8"> 0</text>
      <text x="210" y="147" fill="#94a3b8"> 0</text>
      <text x="310" y="147" fill="#94a3b8"> 0</text>
      <text x="385" y="147" fill="#10b981">&#x2714;</text>

      <!-- Row 6: (0, +1) -> (+1, 0) -->
      <rect x="0" y="160" width="415" height="28" fill="#141e33"/>
      <text x="40" y="179" fill="#94a3b8"> 0</text>
      <text x="120" y="179" fill="#34d399">+1</text>
      <text x="210" y="179" fill="#38bdf8">+1</text>
      <text x="310" y="179" fill="#94a3b8"> 0</text>
      <text x="385" y="179" fill="#10b981">&#x2714;</text>

      <!-- Row 7: (+1, -1) -> (0, 0) -->
      <rect x="0" y="192" width="415" height="28" fill="#0f172a"/>
      <text x="40" y="211" fill="#34d399">+1</text>
      <text x="120" y="211" fill="#ef4444">-1</text>
      <text x="210" y="211" fill="#94a3b8"> 0</text>
      <text x="310" y="211" fill="#94a3b8"> 0</text>
      <text x="385" y="211" fill="#10b981">&#x2714;</text>

      <!-- Row 8: (+1, 0) -> (+1, 0) -->
      <rect x="0" y="224" width="415" height="28" fill="#141e33"/>
      <text x="40" y="243" fill="#34d399">+1</text>
      <text x="120" y="243" fill="#94a3b8"> 0</text>
      <text x="210" y="243" fill="#38bdf8">+1</text>
      <text x="310" y="243" fill="#94a3b8"> 0</text>
      <text x="385" y="243" fill="#10b981">&#x2714;</text>

      <!-- Row 9: (+1, +1) -> (-1, +1) -->
      <rect x="0" y="256" width="415" height="28" fill="#0f172a"/>
      <text x="40" y="275" fill="#34d399">+1</text>
      <text x="120" y="275" fill="#34d399">+1</text>
      <text x="210" y="275" fill="#ef4444">-1</text>
      <text x="310" y="275" fill="#34d399">+1</text>
      <text x="385" y="275" fill="#10b981">&#x2714;</text>
    </g>

    <!-- Bottom Actions -->
    <g transform="translate(20, 460)">
      <rect width="415" height="70" rx="8" fill="#080e1b" stroke="#1e293b"/>
      <text x="16" y="26" fill="#38bdf8" class="mono" font-size="11" font-weight="700">ALGEBRAIC PROOF ENGINE</text>
      <text x="16" y="45" fill="#94a3b8" class="sans" font-size="11">Kleene strong completeness &amp; De Morgan duals verified.</text>
      <text x="16" y="60" fill="#34d399" class="mono" font-size="10">&#x25CF; Radix Economy: 2.718 E-Efficiency Optimum</text>
    </g>
  </g>

</svg>
