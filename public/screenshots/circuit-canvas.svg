<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="nodeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="adderHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#1e293b" opacity="0.8"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nodeCard { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#canvasBg)"/>
  <rect width="1200" height="675" fill="url(#dotGrid)"/>

  <!-- Top Canvas Toolbar -->
  <rect x="0" y="0" width="1200" height="48" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="30" fill="#38bdf8" class="mono" font-size="14" font-weight="700">&lt; CIRCUIT_CANVAS // ZERO-OVERLAP PHYSICS ACTIVE &gt;</text>
  
  <!-- Canvas Action Buttons -->
  <g transform="translate(680, 10)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="55" y="18" fill="#cbd5e1" class="mono" font-size="11" text-anchor="middle">GRID: 24px</text>

    <rect x="120" y="0" width="120" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7"/>
    <text x="180" y="18" fill="#38bdf8" class="mono" font-size="11" text-anchor="middle">&#x2714; AUTO-LAYOUT</text>

    <rect x="250" y="0" width="130" height="28" rx="6" fill="#059669" fill-opacity="0.2" stroke="#059669"/>
    <text x="315" y="18" fill="#34d399" class="mono" font-size="11" text-anchor="middle">+ ADD COMPONENT</text>

    <rect x="390" y="0" width="110" height="28" rx="6" fill="#475569" stroke="#64748b"/>
    <text x="445" y="18" fill="#ffffff" class="mono" font-size="11" text-anchor="middle">ZOOM: 100%</text>
  </g>

  <!-- Wires -->
  <g fill="none" stroke-linecap="round">
    <path d="M 330 180 C 420 180, 430 220, 500 220" stroke="#38bdf8" stroke-width="3.5" opacity="0.9"/>
    <path d="M 330 330 C 420 330, 430 270, 500 270" stroke="#34d399" stroke-width="3.5" opacity="0.9"/>
    <path d="M 780 220 C 850 220, 870 200, 930 200" stroke="#34d399" stroke-width="3.5" opacity="0.9"/>
    <path d="M 780 270 C 850 270, 870 340, 930 340" stroke="#38bdf8" stroke-width="3.5" opacity="0.9"/>
  </g>

  <!-- Wire Flow Particles -->
  <circle cx="430" cy="205" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
  <circle cx="430" cy="295" r="4.5" fill="#34d399" filter="url(#glowEmerald)"/>

  <!-- NODE 1: Trit Source X (Left Top) -->
  <g transform="translate(100, 110)">
    <rect width="230" height="135" class="nodeCard" stroke="#0284c7" stroke-width="1.8" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.7))"/>
    <rect width="230" height="34" fill="url(#nodeHeader)" rx="12 12 0 0"/>
    <text x="18" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">TRIT_SOURCE_X</text>
    <text x="16" y="60" fill="#94a3b8" class="sans" font-size="11">Selected Trit Value:</text>
    
    <!-- Ternary State Selector Buttons -->
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="55" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="27" y="20" fill="#94a3b8" class="mono" font-size="12" text-anchor="middle">-1 (F)</text>

      <rect x="65" y="0" width="55" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="92" y="20" fill="#94a3b8" class="mono" font-size="12" text-anchor="middle">0 (U)</text>

      <rect x="130" y="0" width="65" height="32" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowCyan)"/>
      <text x="162" y="20" fill="#ffffff" class="mono" font-size="13" font-weight="800" text-anchor="middle">+1 (T)</text>
    </g>
    <!-- Output Terminal Pin -->
    <circle cx="230" cy="70" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- NODE 2: Trit Source Y (Left Bottom) -->
  <g transform="translate(100, 260)">
    <rect width="230" height="135" class="nodeCard" stroke="#059669" stroke-width="1.8" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.7))"/>
    <rect width="230" height="34" fill="url(#adderHeader)" rx="12 12 0 0"/>
    <text x="18" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">TRIT_SOURCE_Y</text>
    <text x="16" y="60" fill="#94a3b8" class="sans" font-size="11">Selected Trit Value:</text>
    
    <g transform="translate(16, 74)">
      <rect x="0" y="0" width="55" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="27" y="20" fill="#94a3b8" class="mono" font-size="12" text-anchor="middle">-1 (F)</text>

      <rect x="65" y="0" width="65" height="32" rx="6" fill="#059669" stroke="#34d399" stroke-width="1.5" filter="url(#glowEmerald)"/>
      <text x="97" y="20" fill="#ffffff" class="mono" font-size="13" font-weight="800" text-anchor="middle">0 (U)</text>

      <rect x="140" y="0" width="55" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="167" y="20" fill="#94a3b8" class="mono" font-size="12" text-anchor="middle">+1 (T)</text>
    </g>
    <!-- Output Pin -->
    <circle cx="230" cy="70" r="7" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- NODE 3: Balanced Ternary Adder (Center Focus) -->
  <g transform="translate(500, 140)">
    <rect width="280" height="210" class="nodeCard" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.85))"/>
    <rect width="280" height="38" fill="#075985" rx="12 12 0 0"/>
    <circle cx="20" cy="19" r="5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="35" y="24" fill="#ffffff" class="mono" font-size="13" font-weight="800">BALANCED_ADDER (ALU-01)</text>

    <!-- Inputs -->
    <circle cx="0" cy="80" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
    <text x="18" y="84" fill="#94a3b8" class="mono" font-size="11">IN_A [+1]</text>

    <circle cx="0" cy="130" r="7" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
    <text x="18" y="134" fill="#94a3b8" class="mono" font-size="11">IN_B [0]</text>

    <!-- Internal Arithmetic Display -->
    <rect x="16" y="152" width="248" height="42" rx="8" fill="#081426" stroke="#1e3a5f"/>
    <text x="140" y="172" fill="#38bdf8" class="mono" font-size="11" text-anchor="middle">Algebra: (+1) + (0) = +1</text>
    <text x="140" y="187" fill="#34d399" class="mono" font-size="11" font-weight="700" text-anchor="middle">SUM: +1 | CARRY: 0</text>

    <!-- Outputs -->
    <circle cx="280" cy="80" r="7" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
    <text x="215" y="84" fill="#a7f3d0" class="mono" font-size="11">SUM</text>

    <circle cx="280" cy="130" r="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2.5"/>
    <text x="210" y="134" fill="#7dd3fc" class="mono" font-size="11">CARRY</text>

    <!-- Corner Resize Handle (Interactive) -->
    <path d="M 270 200 L 270 205 L 265 205 M 270 195 L 270 205 L 260 205" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <!-- NODE 4: Output Trit Register (Right Top) -->
  <g transform="translate(930, 130)">
    <rect width="210" height="120" class="nodeCard" stroke="#10b981" stroke-width="1.8"/>
    <rect width="210" height="32" fill="#065f46" rx="12 12 0 0"/>
    <text x="16" y="21" fill="#ffffff" class="mono" font-size="12" font-weight="700">OUTPUT_REG_0</text>
    
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="11">Stored Trit:</text>
    <rect x="16" y="65" width="178" height="38" rx="6" fill="#022c22" stroke="#059669"/>
    <text x="105" y="90" fill="#34d399" class="mono" font-size="16" font-weight="800" text-anchor="middle">+1 (HIGH/TRUE)</text>
    <circle cx="0" cy="70" r="7" fill="#34d399" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- ADAPTIVE CONTEXT MENU OVERLAY (Illustrating Right-Click Power) -->
  <g transform="translate(480, 390)" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.9))">
    <rect width="270" height="240" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="270" height="28" fill="#1e293b" rx="10 10 0 0"/>
    <text x="14" y="18" fill="#38bdf8" class="mono" font-size="11" font-weight="700">&#x2699; NODE CONTEXT MENU</text>

    <!-- Menu Items -->
    <g transform="translate(14, 40)">
      <text x="0" y="14" fill="#e2e8f0" class="sans" font-size="12">&#x25B6; Attach Oscilloscope Probe</text>
      <line x1="0" y1="24" x2="242" y2="24" stroke="#1e293b"/>

      <text x="0" y="44" fill="#e2e8f0" class="sans" font-size="12">&#x26A1; Invert Ternary Signal (-X)</text>
      <line x1="0" y1="54" x2="242" y2="54" stroke="#1e293b"/>

      <text x="0" y="74" fill="#e2e8f0" class="sans" font-size="12">&#x1F527; Preset: Compact (230px)</text>
      <text x="0" y="94" fill="#38bdf8" class="sans" font-size="12" font-weight="700">&#x2714; Preset: Standard (280px)</text>
      <text x="0" y="114" fill="#e2e8f0" class="sans" font-size="12">&#x1F527; Preset: Large (350px)</text>
      <line x1="0" y1="124" x2="242" y2="124" stroke="#1e293b"/>

      <text x="0" y="144" fill="#cbd5e1" class="sans" font-size="12">&#x1F4C4; Duplicate Node (Ctrl+D)</text>
      <text x="0" y="166" fill="#ef4444" class="sans" font-size="12" font-weight="600">&#x1F5D1; Delete Node (Del)</text>
    </g>
  </g>

  <!-- Physics Non-Overlap Indicator Pill -->
  <g transform="translate(80, 600)">
    <rect width="360" height="42" rx="8" fill="#0b1329" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="24" cy="21" r="6" fill="#10b981" filter="url(#glowEmerald)"/>
    <text x="40" y="25" fill="#94a3b8" class="mono" font-size="11">COLLISION SOLVER: <tspan fill="#34d399" font-weight="700">0 OVERLAPS DETECTED</tspan></text>
  </g>

</svg>
