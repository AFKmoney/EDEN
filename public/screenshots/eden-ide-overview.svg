<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1527" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#1e293b" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .glass { fill: #0f172a; fill-opacity: 0.85; stroke: #1e293b; stroke-width: 1; }
    .card { fill: url(#cardGrad); stroke: #334155; stroke-width: 1.2; rx: 12px; }
  </style>

  <!-- Deep Workspace Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Subtle Radial Glow behind nodes -->
  <circle cx="580" cy="320" r="280" fill="#06b6d4" opacity="0.04" filter="url(#cyanGlow)"/>
  <circle cx="880" cy="240" r="200" fill="#10b981" opacity="0.04" filter="url(#emeraldGlow)"/>

  <!-- TOP STATUS / NAVIGATION HEADER -->
  <rect x="0" y="0" width="1200" height="42" fill="#0b1120" opacity="0.95" stroke="#1e293b" stroke-width="1"/>
  <circle cx="20" cy="21" r="5" fill="#ef4444"/>
  <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>
  
  <text x="80" y="26" fill="#06b6d4" class="sans" font-weight="800" font-size="13" letter-spacing="2">EDEN // TERNARY GRAPH IDE</text>
  <rect x="290" y="11" width="70" height="20" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="325" y="25" fill="#38bdf8" class="mono" font-size="10" text-anchor="middle">v3.2.0</text>

  <!-- Header Center Badges -->
  <rect x="480" y="10" width="240" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="496" cy="21" r="4" fill="#10b981"/>
  <text x="508" y="25" fill="#94a3b8" class="mono" font-size="11">KERNEL: <tspan fill="#10b981">RUNNING (1.5 Hz)</tspan></text>
  
  <!-- Header Right Stats -->
  <text x="960" y="25" fill="#64748b" class="mono" font-size="11">TRITS: <tspan fill="#38bdf8">1,024</tspan> | RADIX: <tspan fill="#a855f7">3 (BALANCED)</tspan></text>
  <rect x="1115" y="10" width="70" height="22" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="1150" y="25" fill="#10b981" class="sans" font-size="11" font-weight="700" text-anchor="middle">LIVE VM</text>

  <!-- LEFT SIDEBAR -->
  <rect x="0" y="42" width="60" height="633" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Sidebar Icons -->
  <g transform="translate(18, 60)">
    <!-- Hub Icon -->
    <rect x="0" y="0" width="24" height="24" rx="6" fill="#06b6d4" fill-opacity="0.2"/>
    <circle cx="12" cy="12" r="5" fill="#06b6d4"/>
    
    <!-- AI Chat Icon -->
    <rect x="0" y="40" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <circle cx="12" cy="52" r="5" fill="#10b981"/>

    <!-- Truth Table Icon -->
    <rect x="0" y="80" width="24" height="24" rx="6" fill="#a855f7" fill-opacity="0.15"/>
    <rect x="6" y="86" width="12" height="12" fill="#a855f7" rx="2"/>

    <!-- Scope Icon -->
    <rect x="0" y="120" width="24" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15"/>
    <path d="M 4 135 Q 12 125 16 135 T 24 130" stroke="#f59e0b" stroke-width="2" fill="none"/>

    <!-- TASM Studio -->
    <rect x="0" y="160" width="24" height="24" rx="6" fill="#06b6d4" fill-opacity="0.15"/>
    <text x="12" y="176" fill="#06b6d4" class="mono" font-size="11" text-anchor="middle">&gt;_</text>

    <!-- Component Palette -->
    <rect x="0" y="200" width="24" height="24" rx="6" fill="#64748b" fill-opacity="0.2"/>
    <text x="12" y="217" fill="#cbd5e1" class="sans" font-size="16" text-anchor="middle">+</text>

    <!-- VM Play Button -->
    <rect x="-4" y="520" width="32" height="32" rx="8" fill="#10b981" filter="url(#emeraldGlow)"/>
    <polygon points="10,530 22,536 10,542" fill="#ffffff"/>
  </g>

  <!-- CIRCUIT GRAPH CANVAS (Center Stage) -->
  <!-- Interconnecting Wires with Directional Flow -->
  <g fill="none" stroke-linecap="round">
    <!-- Wire 1: Input A to Ternary Half-Adder -->
    <path d="M 285 195 C 360 195, 380 230, 440 230" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
    <!-- Wire 2: Input B to Ternary Half-Adder -->
    <path d="M 285 305 C 360 305, 380 270, 440 270" stroke="#10b981" stroke-width="3" opacity="0.9"/>
    <!-- Wire 3: Half-Adder Sum to Consensus Gate -->
    <path d="M 700 230 C 760 230, 780 200, 830 200" stroke="#10b981" stroke-width="3" opacity="0.9"/>
    <!-- Wire 4: Half-Adder Carry to Output -->
    <path d="M 700 270 C 760 270, 780 320, 830 320" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
    <!-- Wire 5: Inverter Loop -->
    <path d="M 700 450 C 780 450, 800 420, 830 420" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.8"/>
  </g>

  <!-- Active Signal Pulses on Wires -->
  <circle cx="360" cy="210" r="4" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <circle cx="560" cy="245" r="4" fill="#34d399" filter="url(#emeraldGlow)"/>
  <circle cx="765" cy="215" r="4" fill="#34d399" filter="url(#emeraldGlow)"/>

  <!-- NODE 1: Trit Input A -->
  <g transform="translate(100, 140)">
    <rect width="185" height="110" class="card" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect width="185" height="30" fill="#1e293b" fill-opacity="0.8" rx="12 12 0 0"/>
    <circle cx="16" cy="15" r="4" fill="#06b6d4"/>
    <text x="28" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="700">INPUT_TRIT_A</text>
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="11">Ternary State:</text>
    
    <!-- State Badges (-1, 0, +1) -->
    <g transform="translate(16, 68)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="#334155"/>
      <text x="18" y="16" fill="#64748b" class="mono" font-size="11" text-anchor="middle">-1</text>

      <rect x="42" y="0" width="36" height="24" rx="4" fill="#334155"/>
      <text x="60" y="16" fill="#64748b" class="mono" font-size="11" text-anchor="middle">0</text>

      <rect x="84" y="0" width="46" height="24" rx="4" fill="#06b6d4" filter="url(#cyanGlow)"/>
      <text x="107" y="16" fill="#ffffff" class="mono" font-size="12" font-weight="700" text-anchor="middle">+1</text>
    </g>
    <!-- Output Pin -->
    <circle cx="185" cy="55" r="6" fill="#06b6d4" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- NODE 2: Trit Input B -->
  <g transform="translate(100, 265)">
    <rect width="185" height="110" class="card" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect width="185" height="30" fill="#1e293b" fill-opacity="0.8" rx="12 12 0 0"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="700">INPUT_TRIT_B</text>
    <text x="16" y="55" fill="#94a3b8" class="sans" font-size="11">Ternary State:</text>
    
    <!-- State Badges (-1, 0, +1) -->
    <g transform="translate(16, 68)">
      <rect x="0" y="0" width="36" height="24" rx="4" fill="#334155"/>
      <text x="18" y="16" fill="#64748b" class="mono" font-size="11" text-anchor="middle">-1</text>

      <rect x="42" y="0" width="46" height="24" rx="4" fill="#10b981" filter="url(#emeraldGlow)"/>
      <text x="65" y="16" fill="#ffffff" class="mono" font-size="12" font-weight="700" text-anchor="middle">0</text>

      <rect x="94" y="0" width="36" height="24" rx="4" fill="#334155"/>
      <text x="112" y="16" fill="#64748b" class="mono" font-size="11" text-anchor="middle">+1</text>
    </g>
    <!-- Output Pin -->
    <circle cx="185" cy="55" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- NODE 3: Balanced Ternary Half-Adder (MAIN COMPONENT) -->
  <g transform="translate(440, 160)">
    <rect width="260" height="175" class="card" stroke="#06b6d4" stroke-width="1.8" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    <rect width="260" height="34" fill="#082f49" fill-opacity="0.9" rx="12 12 0 0"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
    <text x="32" y="21" fill="#38bdf8" class="mono" font-size="12" font-weight="800">TERNARY_HALF_ADDER</text>
    
    <!-- Inputs Pins -->
    <circle cx="0" cy="70" r="6" fill="#06b6d4" stroke="#0f172a" stroke-width="2"/>
    <text x="14" y="74" fill="#94a3b8" class="mono" font-size="10">IN_A (+1)</text>

    <circle cx="0" cy="110" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
    <text x="14" y="114" fill="#94a3b8" class="mono" font-size="10">IN_B (0)</text>

    <!-- Mathematical Expression Box -->
    <rect x="14" y="130" width="232" height="32" rx="6" fill="#0b1329" stroke="#1e293b"/>
    <text x="130" y="150" fill="#38bdf8" class="mono" font-size="11" text-anchor="middle">SUM = +1 | CARRY = 0</text>

    <!-- Output Pins -->
    <circle cx="260" cy="70" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
    <text x="210" y="74" fill="#a7f3d0" class="mono" font-size="10">SUM_S</text>

    <circle cx="260" cy="110" r="6" fill="#06b6d4" stroke="#0f172a" stroke-width="2"/>
    <text x="205" y="114" fill="#7dd3fc" class="mono" font-size="10">CARRY_C</text>

    <!-- Non-Overlap Resize Anchor Indicator -->
    <rect x="250" y="165" width="10" height="10" fill="#38bdf8" rx="2" opacity="0.8"/>
  </g>

  <!-- NODE 4: Kleene Consensus Voter -->
  <g transform="translate(830, 140)">
    <rect width="210" height="130" class="card" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect width="210" height="30" fill="#1e293b" rx="12 12 0 0"/>
    <circle cx="16" cy="15" r="4" fill="#a855f7"/>
    <text x="28" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="700">KLEENE_CONSENSUS</text>
    
    <circle cx="0" cy="60" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
    <text x="14" y="64" fill="#94a3b8" class="mono" font-size="10">VOTE_IN</text>

    <rect x="14" y="80" width="182" height="36" rx="6" fill="#1e1b4b" stroke="#4c1d95"/>
    <text x="105" y="102" fill="#c084fc" class="mono" font-size="11" font-weight="700" text-anchor="middle">RESOLVED: +1 (TRUE)</text>

    <circle cx="210" cy="80" r="6" fill="#c084fc" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- NODE 5: Ternary Inverter (NOT-) -->
  <g transform="translate(440, 390)">
    <rect width="260" height="110" class="card" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect width="260" height="30" fill="#1e293b" rx="12 12 0 0"/>
    <circle cx="16" cy="15" r="4" fill="#f59e0b"/>
    <text x="28" y="19" fill="#e2e8f0" class="mono" font-size="11" font-weight="700">TERNARY_INVERTER (-X)</text>
    
    <text x="20" y="65" fill="#94a3b8" class="sans" font-size="11">Simple Invert: +1 &rarr; -1, 0 &rarr; 0, -1 &rarr; +1</text>
    <rect x="20" y="75" width="220" height="24" rx="4" fill="#0f172a"/>
    <text x="130" y="91" fill="#fbbf24" class="mono" font-size="11" text-anchor="middle">f(+1) = -1 (FALSE)</text>
  </g>

  <!-- LIVE OSCILLOSCOPE DOCK (Bottom Center) -->
  <g transform="translate(100, 525)">
    <rect width="600" height="130" rx="10" fill="#090f1d" stroke="#1e293b" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    <rect width="600" height="26" fill="#0f172a" rx="10 10 0 0"/>
    <text x="16" y="17" fill="#38bdf8" class="mono" font-size="10" font-weight="700">&bull; DIGITAL LOGIC ANALYZER // REAL-TIME TRIT TRACES</text>
    <text x="520" y="17" fill="#64748b" class="mono" font-size="10">CH1 &bull; CH2 &bull; CLK</text>

    <!-- Waveform Grids -->
    <line x1="16" y1="58" x2="584" y2="58" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="16" y1="88" x2="584" y2="88" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="16" y1="118" x2="584" y2="118" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Channel 1: Green Waveform (+1, 0, -1 steps) -->
    <path d="M 20 45 L 80 45 L 80 58 L 160 58 L 160 70 L 220 70 L 220 45 L 310 45 L 310 58 L 400 58 L 400 45 L 500 45 L 500 70 L 580 70" 
          fill="none" stroke="#10b981" stroke-width="2.2" filter="url(#emeraldGlow)"/>

    <!-- Channel 2: Cyan Clock Trace -->
    <path d="M 20 95 L 60 95 L 60 115 L 100 115 L 100 95 L 140 95 L 140 115 L 180 115 L 180 95 L 220 95 L 220 115 L 260 115 L 260 95 L 300 95 L 300 115 L 340 115 L 340 95 L 380 95 L 380 115 L 420 115 L 420 95 L 460 95 L 460 115 L 500 115 L 500 95 L 540 95 L 540 115 L 580 115"
          fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.8"/>
  </g>

  <!-- AI COPILOT & REASONING PANEL (Right Dock) -->
  <g transform="translate(730, 480)">
    <rect width="445" height="175" rx="12" fill="#0d1424" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.9))"/>
    <rect width="445" height="32" fill="#141f36" rx="12 12 0 0"/>
    <circle cx="16" cy="16" r="4" fill="#a855f7"/>
    <text x="28" y="20" fill="#c084fc" class="mono" font-size="11" font-weight="700">AI COPILOT // CHAIN-OF-THOUGHT</text>
    <rect x="360" y="8" width="70" height="18" rx="4" fill="#a855f7" fill-opacity="0.2"/>
    <text x="395" y="20" fill="#d8b4fe" class="mono" font-size="9" text-anchor="middle">GEMINI 2.5</text>

    <!-- AI Reasoning Stream -->
    <text x="16" y="55" fill="#38bdf8" class="mono" font-size="11">&gt; Synthesizing Balanced Ternary ALU module...</text>
    <text x="16" y="75" fill="#94a3b8" class="sans" font-size="11">&#x2714; Verified Kleene truth table for 27 ternary states.</text>
    <text x="16" y="95" fill="#94a3b8" class="sans" font-size="11">&#x2714; Non-overlapping collision matrix resolved (0 overlaps).</text>
    
    <!-- Code snippet pill -->
    <rect x="16" y="110" width="413" height="48" rx="6" fill="#070c18" stroke="#1e293b"/>
    <text x="26" y="128" fill="#10b981" class="mono" font-size="10">tasm: ADD3 T0, T1, T2  ; Kleene add with ternary carry</text>
    <text x="26" y="145" fill="#64748b" class="mono" font-size="10">result: T0=+1 (TRUE), Carry=0 (NEUTRAL)</text>
  </g>

</svg>
